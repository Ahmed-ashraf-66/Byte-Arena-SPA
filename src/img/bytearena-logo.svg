<svg viewBox="0 0 480 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0B14"/>
      <stop offset="100%" stop-color="#17121F"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9D4EFF"/>
      <stop offset="100%" stop-color="#5B1FCC"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B980FF"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon: stylized game controller -->
  <g filter="url(#glow)">
    <path d="M35 65
             c0 -14 10 -24 24 -24
             h22
             c14 0 24 10 24 24
             v8
             c0 12 -9 21 -20 21
             c-6 0 -9 -3 -13 -8
             c-2 -3 -6 -3 -8 0
             c-4 5 -7 8 -13 8
             c-11 0 -24 -9 -24 -21
             z"
          fill="url(#purpleGrad)"/>
    <circle cx="46" cy="61" r="3.2" fill="#0D0B14"/>
    <circle cx="46" cy="71" r="3.2" fill="#0D0B14"/>
    <circle cx="41" cy="66" r="3.2" fill="#0D0B14"/>
    <circle cx="51" cy="66" r="3.2" fill="#0D0B14"/>
    <circle cx="88" cy="62" r="4" fill="#00E5FF"/>
    <circle cx="98" cy="70" r="4" fill="#00E5FF"/>
  </g>

  <!-- Wordmark -->
  <text x="130" y="70" font-family="Rajdhani, Orbitron, sans-serif" font-weight="700" font-size="42" fill="#EDEBF5" letter-spacing="1">Byte</text>
  <text x="222" y="70" font-family="Rajdhani, Orbitron, sans-serif" font-weight="700" font-size="42" fill="url(#textGrad)" letter-spacing="1" filter="url(#glow)">Arena</text>

  <!-- Tagline -->
  <text x="130" y="95" font-family="Rajdhani, sans-serif" font-weight="500" font-size="14" fill="#8A80A8" letter-spacing="3">GAME STORE</text>
</svg>
